name: Deploy Spring Boot (Docker) to AWS EC2

on:
  push:
    branches: [ "release" ]  # ✅ release 브랜치에서만 배포 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 설정 (빌드용)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Maven 빌드
      - name: Build JAR
        run: mvn clean package -DskipTests

      # 4️⃣ SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_KEY }}" > ~/.ssh/aws-key.pem
          chmod 600 ~/.ssh/aws-key.pem

      # 5️⃣ .env 파일 생성
      - name: Create .env file
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" > .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          cat .env

      # 6️⃣ EC2로 프로젝트 복사
      - name: Copy project to EC2
        run: |
          scp -i ~/.ssh/aws-key.pem -o StrictHostKeyChecking=no -r . ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/home/${{ secrets.AWS_USER }}/goatgam

      # 7️⃣ EC2에서 Docker 빌드 및 실행
      - name: Build and Run Docker container on EC2
        run: |
          ssh -i ~/.ssh/aws-key.pem -o StrictHostKeyChecking=no ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'EOF'
          cd ~/goatgam
          
          # Docker 설치 확인 (없으면 설치)
          if ! command -v docker &> /dev/null
          then
            echo "Docker not found. Installing Docker..."
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi
          
          # 기존 컨테이너 종료 및 삭제
          sudo docker stop goatgam || true
          sudo docker rm goatgam || true
          
          # ✅ 나중에 Dockerfile 추가되면 이 명령이 실제 빌드됨
          sudo docker build -t goatgam .
          
          # ✅ .env 파일 적용 + 8080 포트 연결
          sudo docker run -d --name goatgam --env-file .env -p 8080:8080 goatgam
          
          echo "✅ Docker container started successfully!"
          EOF
