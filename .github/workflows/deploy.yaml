name: Deploy Spring Boot (Docker) to AWS EC2

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:  # 수동 실행도 가능하게

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ gradlew 권한 부여 및 빌드 (goatgam 폴더 내부로 이동)
      - name: Build JAR (Gradle)
        run: |
          cd goatgam
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4️⃣ SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_KEY }}" > ~/.ssh/aws-key.pem
          chmod 600 ~/.ssh/aws-key.pem

      # 5️⃣ .env 파일 생성
      - name: Create .env file
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" > .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          cat .env

      # 6️⃣ EC2로 프로젝트 복사
      - name: Copy project to EC2
        run: |
          scp -i ~/.ssh/aws-key.pem -o StrictHostKeyChecking=no -r . ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/home/${{ secrets.AWS_USER }}/goatgam

      # 7️⃣ EC2에서 Docker 빌드 및 실행
      - name: Build and Run Docker container on EC2
        run: |
          ssh -i ~/.ssh/aws-key.pem -o StrictHostKeyChecking=no ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'EOF'
          cd ~/goatgam/goatgam  # ✅ Dockerfile이 있는 위치로 이동

          # Docker 설치 확인
          if ! command -v docker &> /dev/null
          then
            echo "Docker not found. Installing Docker..."
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi

          # 기존 컨테이너 종료 및 삭제
          sudo docker stop goatgam || true
          sudo docker rm goatgam || true

          # Docker 이미지 빌드 (Dockerfile은 goatgam 폴더 안에 있음)
          sudo docker build -t goatgam .

          # 컨테이너 실행 (.env 적용)
          sudo docker run -d --name goatgam --env-file .env -p 8080:8080 goatgam

          echo "✅ Docker container started successfully!"
          EOF
